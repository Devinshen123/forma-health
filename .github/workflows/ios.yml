name: Forma iPhone
on:
  push:
    branches: ['codex/forma-iphone-app-*']
    paths: ['ios/**', 'scripts/ios*', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/ios*', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Xcode project
        run: node scripts/ios-generate-project.mjs
      - name: Core tests
        run: swift test --package-path ios/Packages/FormaCore
      - name: Select simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          node --input-type=module -e 'import fs from "node:fs"; const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/simulators.json")); const sim=Object.entries(data.devices).filter(([k])=>k.includes("iOS")).flatMap(([,v])=>v).find(x=>x.isAvailable && x.name.startsWith("iPhone")); if(!sim)throw Error("No available iPhone"); fs.appendFileSync(process.env.GITHUB_ENV,"FORMA_SIM="+sim.udid+"\n"); console.log(sim.name);'
      - name: Build native app and UI tests
        run: |
          xcodebuild build-for-testing -project ios/Forma.xcodeproj -scheme Forma -destination "platform=iOS Simulator,id=$FORMA_SIM" -derivedDataPath "$RUNNER_TEMP/FormaDerived" -resultBundlePath "$RUNNER_TEMP/FormaBuild.xcresult" FORMA_LIVE_API=YES CODE_SIGNING_ALLOWED=NO
          python3 -c 'import plistlib,glob,os; values=[]; walk=lambda x: (values.extend([x["FORMA_LIVE_API"]] if "FORMA_LIVE_API" in x else []),[walk(v) for v in x.values()]) if isinstance(x,dict) else [walk(v) for v in x] if isinstance(x,list) else None; [walk(plistlib.load(open(f,"rb"))) for f in glob.glob(os.environ["RUNNER_TEMP"]+"/FormaDerived/Build/Products/*.xctestrun")]; assert values and all(v=="YES" for v in values), "Live API environment was not expanded"; print("Native live API test environment verified")'
      - name: Run native transport tests
        run: |
          npm ci --no-audit --no-fund
          node --import tsx scripts/ios-contract-server.mts > "$RUNNER_TEMP/FormaSyntheticAPI.log" 2>&1 &
          FORMA_API_PID=$!
          trap 'kill "$FORMA_API_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false;for(let i=0;i<30;i++){try{let r=await fetch("http://127.0.0.1:3001/api/capabilities");if(r.ok){ready=true;break;}}catch{} await new Promise(r=>setTimeout(r,1000));}if(!ready)throw Error("Synthetic API did not start");'
          xcodebuild test-without-building -project ios/Forma.xcodeproj -scheme Forma -destination "platform=iOS Simulator,id=$FORMA_SIM" -derivedDataPath "$RUNNER_TEMP/FormaDerived" -resultBundlePath "$RUNNER_TEMP/FormaNative.xcresult" -parallel-testing-enabled NO -only-testing:FormaNativeTests FORMA_LIVE_API=YES CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FormaNative.xcresult" > "$RUNNER_TEMP/FormaNativeSummary.json"
          node --input-type=module -e 'import fs from "node:fs";const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/FormaNativeSummary.json"));if(s.skippedTests!==0||s.failedTests!==0)throw Error("Native transport tests must pass without skips");console.log(JSON.stringify({passed:s.passedTests,failed:s.failedTests,skipped:s.skippedTests}));'
      - name: Run native UI tests
        run: |
          xcodebuild test-without-building -project ios/Forma.xcodeproj -scheme Forma -destination "platform=iOS Simulator,id=$FORMA_SIM" -derivedDataPath "$RUNNER_TEMP/FormaDerived" -resultBundlePath "$RUNNER_TEMP/FormaUI.xcresult" -parallel-testing-enabled NO -only-testing:FormaUITests CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FormaUI.xcresult" > "$RUNNER_TEMP/FormaTestSummary.json"
          node --input-type=module -e 'import fs from "node:fs";const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/FormaTestSummary.json"));if(s.skippedTests!==0||s.failedTests!==0)throw Error("Native tests must pass without skips");console.log(JSON.stringify({passed:s.passedTests,failed:s.failedTests,skipped:s.skippedTests}));'
      - name: Archive unsigned iPhone Release
        run: |
          xcodebuild archive -configuration Release -project ios/Forma.xcodeproj -scheme Forma -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Forma-iPhone-unsigned.xcarchive" -derivedDataPath "$RUNNER_TEMP/FormaDeviceDerived" CODE_SIGNING_ALLOWED=NO
      - name: Capture demo screens
        if: always()
        run: |
          if [ -z "${FORMA_SIM:-}" ]; then exit 0; fi
          xcrun simctl launch "$FORMA_SIM" com.formahealth.app --uitesting
          sleep 3
          xcrun simctl io "$FORMA_SIM" screenshot "$RUNNER_TEMP/Forma-iPhone.png"
      - name: Export UI evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/FormaUI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FormaUI.xcresult" --output-path "$RUNNER_TEMP/FormaScreenshots"
          fi
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forma-ios-simulator
          path: |
            ${{ runner.temp }}/FormaBuild.xcresult
            ${{ runner.temp }}/FormaUI.xcresult
            ${{ runner.temp }}/FormaNative.xcresult
            ${{ runner.temp }}/FormaNativeSummary.json
            ${{ runner.temp }}/FormaTestSummary.json
            ${{ runner.temp }}/Forma-iPhone.png
            ${{ runner.temp }}/FormaScreenshots
            ${{ runner.temp }}/Forma-iPhone-unsigned.xcarchive
            ${{ runner.temp }}/FormaDerived/Build/Products/Debug-iphonesimulator/Forma.app
          retention-days: 7
